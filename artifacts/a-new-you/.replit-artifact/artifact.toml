kind = "web"
previewPath = "/"
title = "A New You — Christine M Long"
description = "Premium marketing website for A New You, Christine M Long's founder-led personal and professional transformation practice. Serves established women, business owners and leaders in Melbourne and online across Australia. Primary CTA: Book a Complimentary Clarity Call."
version = "1.0.0"
id = "artifacts/a-new-you"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22134

[services.development]
run = "pnpm --filter @workspace/a-new-you run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/a-new-you", "run", "build" ]
serve = "static"
publicDir = "artifacts/a-new-you/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22134"
BASE_PATH = "/"
